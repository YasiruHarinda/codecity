# Builds the web viewer and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

# The deploy step needs permission to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, the older deploy is cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (a broken push never reaches the site)
        run: npm test

      # A project site lives at https://<user>.github.io/<repo>/, so assets need the "/<repo>/" prefix.
      # A repo named "<user>.github.io" is served from the root instead.
      - name: Work out the site's base path
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/$repo/"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Base path: $base"

      - name: Build the web app
        run: npm run build -w web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
